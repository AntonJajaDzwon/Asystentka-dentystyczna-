  <!-- Dynamic Apple Touch Icon Generator (512x512 PNG via Canvas for Single-File GitHub Pages) -->
  <script>
    (function generateAppleTouchIcon() {
      try {
        const size = 512;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        // 1. Background gradient (#0d9488 -> #0f766e)
        const grad = ctx.createLinearGradient(0, 0, size, size);
        grad.addColorStop(0, '#0d9488');
        grad.addColorStop(1, '#0f766e');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        // Subtle soft radial highlight
        const glow = ctx.createRadialGradient(size * 0.3, size * 0.25, 20, size * 0.5, size * 0.5, size * 0.7);
        glow.addColorStop(0, 'rgba(255, 255, 255, 0.22)');
        glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size, size);

        // 2. Centered White Tooth Silhouette (scaled from 24x24 viewBox)
        ctx.save();
        const scale = 14.5;
        const offsetX = (size - 24 * scale) / 2;
        const offsetY = (size - 24 * scale) / 2 + 6;
        ctx.translate(offsetX, offsetY);
        ctx.scale(scale, scale);

        const toothPath = new Path2D(
          'M7 4c-2.2 0-4 1.8-4 4.2 0 2.3 1 4.2 1.8 6.4.6 1.7 1 4.4 2.2 4.4 1.1 0 1.4-2.1 2.2-3.4.5-.8 1.4-1.1 2.8-1.1s2.3.3 2.8 1.1c.8 1.3 1.1 3.4 2.2 3.4 1.2 0 1.6-2.7 2.2-4.4.8-2.2 1.8-4.1 1.8-6.4C21 5.8 19.2 4 17 4c-1.8 0-2.8.8-5 .8S8.8 4 7 4z'
        );

        ctx.shadowColor = 'rgba(15, 23, 42, 0.22)';
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 8;
        ctx.fillStyle = '#ffffff';
        ctx.fill(toothPath);
        ctx.restore();

        const dataUrl = canvas.toDataURL('image/png');

        const appleLink = document.createElement('link');
        appleLink.rel = 'apple-touch-icon';
        appleLink.sizes = '512x512';
        appleLink.href = dataUrl;
        document.head.appendChild(appleLink);

        const iconLink = document.createElement('link');
        iconLink.rel = 'icon';
        iconLink.type = 'image/png';
        iconLink.href = dataUrl;
        document.head.appendChild(iconLink);
      } catch (e) {
        console.warn('Nie udało się wygenerować ikony PWA:', e);
      }
    })();
  </script>

    /* =========================================================================
       2. FDI TOOTH CHART KNOWLEDGE GENERATOR (PERMANENT 1-4 & DECIDUOUS 5-8)
       ========================================================================= */
    function getToothInfo(fdiCode) {
      const code = String(fdiCode);
      const q = parseInt(code[0], 10);
      const pos = parseInt(code[1], 10);

      const quadrants = {
        1: { name: 'Ćwiartka I — Prawa górna (stałe)', arch: 'Górny', side: 'prawy', latinArch: 'superior', latinSide: 'dexter', isUpper: true, isMilk: false },
        2: { name: 'Ćwiartka II — Lewa górna (stałe)', arch: 'Górny', side: 'lewy', latinArch: 'superior', latinSide: 'sinister', isUpper: true, isMilk: false },
        3: { name: 'Ćwiartka III — Lewa dolna (stałe)', arch: 'Dolny', side: 'lewy', latinArch: 'inferior', latinSide: 'sinister', isUpper: false, isMilk: false },
        4: { name: 'Ćwiartka IV — Prawa dolna (stałe)', arch: 'Dolny', side: 'prawy', latinArch: 'inferior', latinSide: 'dexter', isUpper: false, isMilk: false },
        5: { name: 'Ćwiartka V — Prawa górna (mleczne)', arch: 'Górny', side: 'prawy', latinArch: 'superior', latinSide: 'dexter', isUpper: true, isMilk: true },
        6: { name: 'Ćwiartka VI — Lewa górna (mleczne)', arch: 'Górny', side: 'lewy', latinArch: 'superior', latinSide: 'sinister', isUpper: true, isMilk: true },
        7: { name: 'Ćwiartka VII — Lewa dolna (mleczne)', arch: 'Dolny', side: 'lewy', latinArch: 'inferior', latinSide: 'sinister', isUpper: false, isMilk: true },
        8: { name: 'Ćwiartka VIII — Prawa dolna (mleczne)', arch: 'Dolny', side: 'prawy', latinArch: 'inferior', latinSide: 'dexter', isUpper: false, isMilk: true }
      };

      const qInfo = quadrants[q];
      let plBase = '';
      let latBase = '';
      let roots = '';
      let note = '';

      if (!qInfo.isMilk) {
        const map = {
          1: { pl: 'siekacz przyśrodkowy', lat: 'Dens incisivus medialis', roots: '1 korzeń (1 kanał)', note: 'Kluczowa strefa estetyczna — precyzyjny dobór koloru kompozytu przed odwodnieniem zęba.' },
          2: { pl: 'siekacz boczny', lat: 'Dens incisivus lateralis', roots: '1 korzeń (1 kanał)', note: 'Często węższa korona; przy opracowaniu zachowawczym przydatny pasek celuloidowy.' },
          3: { pl: 'kieł', lat: 'Dens caninus', roots: '1 bardzo długi korzeń (1 kanał)', note: 'Najdłuższy korzeń w łuku zębowym (często >25 mm w endodoncji — przygotuj pilniki 25/31 mm).' },
          4: {
            pl: 'pierwszy ząb przedtrzonowy',
            lat: 'Dens premolaris primus',
            roots: qInfo.isUpper ? 'Zazwyczaj 2 korzenie (2 kanały)' : 'Zazwyczaj 1 korzeń (1 kanał)',
            note: qInfo.isUpper ? 'Górna czwórka ma zwykle 2 korzenie (policzkowy i podniebienny) — ważna informacja przy endo.' : 'Dolna czwórka ma wyraźny guzek policzkowy i mniejszy językowy.'
          },
          5: { pl: 'drugi ząb przedtrzonowy', lat: 'Dens premolaris secundus', roots: 'Zazwyczaj 1 korzeń (1–2 kanały)', note: 'Przy ubytkach stycznych klasy II przygotuj matrycę sekcyjną, pierścień i klin.' },
          6: {
            pl: 'pierwszy ząb trzonowy',
            lat: 'Dens molaris primus',
            roots: qInfo.isUpper ? '3 korzenie (3–4 kanały, często MB2)' : '2 korzenie (3–4 kanały)',
            note: 'Pierwszy wyrzynający się ząb stały (~6. r.ż., tzw. ząb klucza zgryzu). Często wymaga lakowania u dzieci.'
          },
          7: {
            pl: 'drugi ząb trzonowy',
            lat: 'Dens molaris secundus',
            roots: qInfo.isUpper ? '3 korzenie (3 kanały)' : '2 korzenie (3 kanały)',
            note: 'Trudniejszy dostęp — szczególnie ważne sprawne odciąganie policzka lusterkiem i kontrola śliny ssakiem.'
          },
          8: {
            pl: 'trzeci ząb trzonowy (ząb mądrości)',
            lat: 'Dens molaris tertius (serotinus)',
            roots: 'Zmienna anatomia (1–4 korzenie, często zlane)',
            note: 'Częste wskazanie do ekstrakcji chirurgicznej — zawsze wymagane aktualne zdjęcie pantomograficzne lub CBCT.'
          }
        };
        const t = map[pos];
        plBase = `${qInfo.arch} ${qInfo.side} ${t.pl}`;
        latBase = `${t.lat} ${qInfo.latinArch} ${qInfo.latinSide}`;
        roots = t.roots;
        note = t.note;
      } else {
        const milkMap = {
          1: { pl: 'mleczny siekacz przyśrodkowy', lat: 'Dens incisivus medialis deciduus', roots: '1 korzeń', note: 'Wyrzyna się ok. 6–8 miesiąca życia. Cieńsze szkliwo i większa komora miazgi niż w zębach stałych.' },
          2: { pl: 'mleczny siekacz boczny', lat: 'Dens incisivus lateralis deciduus', roots: '1 korzeń', note: 'Przy leczeniu dzieci pamiętaj o zasadzie „Tell-Show-Do” (powiedz, pokaż, zrób).' },
          3: { pl: 'mleczny kieł', lat: 'Dens caninus deciduus', roots: '1 korzeń', note: 'Utrzymuje miejsce w łuku aż do 9–12 roku życia.' },
          4: {
            pl: 'mleczny pierwszy ząb trzonowy',
            lat: 'Dens molaris primus deciduus',
            roots: qInfo.isUpper ? '3 szeroko rozstawione korzenie' : '2 rozstawione korzenie',
            note: 'Uwaga: w uzębieniu mlecznym NIE MA przedtrzonowców — czwórka mleczna to pierwszy trzonowiec!'
          },
          5: {
            pl: 'mleczny drugi ząb trzonowy',
            lat: 'Dens molaris secundus deciduus',
            roots: qInfo.isUpper ? '3 korzenie' : '2 korzenie',
            note: 'Korzenie obejmują zawiązek stałego drugiego przedtrzonowca. Często stosowane materiały glasjonomerowe lub kompomer.'
          }
        };
        const t = milkMap[pos];
        plBase = `${qInfo.arch} ${qInfo.side} ${t.pl}`;
        latBase = `${t.lat} ${qInfo.latinArch} ${qInfo.latinSide}`;
        roots = t.roots;
        note = t.note;
      }

      return {
        code,
        quadrantName: qInfo.name,
        polishName: plBase,
        latinName: latBase,
        roots,
        note
      };
    }

    /* =========================================================================
       3. STATE MANAGEMENT & LOCALSTORAGE PERSISTENCE
       ========================================================================= */
    const defaultState = {
      settings: {
        targetHours: 140,
        studentName: '',
        clinicName: '',
        supervisorName: '',
        darkMode: false
      },
      shifts: [],
      notes: [],
      timer: {
        running: false,
        startTimestamp: null,
        accumulatedMs: 0,
        sessionStartClock: null // e.g., "08:15"
      },
      checklist: {}
    };

    let state = loadState();

    // Ephemeral UI State (not saved to localStorage)
    let ui = {
      activeTab: 'pulpit',
      calYear: new Date().getFullYear(),
      calMonth: new Date().getMonth(),
      noteFilter: 'Wszystkie',
      noteSearch: '',
      toolSection: 'fdi', // 'fdi' | 'skroty' | 'sterylizacja' | 'zestawy'
      fdiMode: 'permanent', // 'permanent' | 'deciduous'
      selectedTooth: '16',
      abbrSearch: '',
      openKitId: 'kit-diag'
    };

    let timerIntervalId = null;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          settings: { ...defaultState.settings, ...(parsed.settings || {}) },
          shifts: Array.isArray(parsed.shifts) ? parsed.shifts : [],
          notes: Array.isArray(parsed.notes) ? parsed.notes : [],
          timer: { ...defaultState.timer, ...(parsed.timer || {}) },
          checklist: parsed.checklist && typeof parsed.checklist === 'object' ? parsed.checklist : {}
        };
      } catch (err) {
        console.error('Błąd odczytu localStorage:', err);
        return structuredClone(defaultState);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Błąd zapisu localStorage:', err);
        showToast('Nie udało się zapisać danych w pamięci przeglądarki.', 'error');
      }
    }

    /* =========================================================================
       4. DATE, TIME & HELPER UTILITIES
       ========================================================================= */
    function formatLocalDate(dateObj = new Date()) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-');
      return `${d}.${m}.${y}`;
    }

    function formatTimeNow(dateObj = new Date()) {
      return `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`;
    }

    function formatHours(val) {
      const n = Number(val) || 0;
      return Number.isInteger(n) ? `${n}` : `${parseFloat(n.toFixed(2))}`;
    }

    function calculateHoursFromRange(startTime, endTime, breakMins = 0) {
      if (!startTime || !endTime) return 0;
      const [sh, sm] = startTime.split(':').map(Number);
      const [eh, em] = endTime.split(':').map(Number);
      let startTotal = sh * 60 + sm;
      let endTotal = eh * 60 + em;
      if (endTotal < startTotal) endTotal += 24 * 60; // overnight safety
      const diffMins = Math.max(0, endTotal - startTotal - (Number(breakMins) || 0));
      return Math.round((diffMins / 60) * 100) / 100;
    }

    function generateId() {
      return 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
    }

    function escapeHtml(str = '') {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Safe clipboard copy compatible with iFrames & mobile browsers
    function copyToClipboard(text) {
      try {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const success = document.execCommand('copy');
        document.body.removeChild(textarea);
        if (success) {
          showToast('Skopiowano do schowka!', 'success');
        } else {
          showToast('Nie udało się skopiować tekstu.', 'error');
        }
      } catch (err) {
        console.error('Copy error:', err);
        showToast('Błąd podczas kopiowania.', 'error');
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const styles = {
        success: 'bg-slate-900 dark:bg-teal-600 text-white border-slate-800 dark:border-teal-500',
        info: 'bg-sky-600 text-white border-sky-500',
        error: 'bg-rose-600 text-white border-rose-500'
      };
      const icon = type === 'error' ? 'alert-circle' : type === 'info' ? 'info' : 'check-circle-2';
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-sm font-medium animate-slide-up ${styles[type] || styles.success}`;
      toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      if (window.lucide) lucide.createIcons({ nodes: [toast] });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-8px)';
        toast.style.transition = 'all 0.25s ease';
        setTimeout(() => toast.remove(), 260);
      }, 2800);
    }

    /* =========================================================================
       5. THEME MANAGEMENT (LIGHT / DARK MODE)
       ========================================================================= */
    function applyTheme() {
      const root = document.documentElement;
      const iconEl = document.getElementById('theme-icon');
      if (state.settings.darkMode) {
        root.classList.add('dark');
        if (iconEl) iconEl.setAttribute('data-lucide', 'sun');
      } else {
        root.classList.remove('dark');
        if (iconEl) iconEl.setAttribute('data-lucide', 'moon');
      }
      if (window.lucide) lucide.createIcons();
    }

    function toggleDarkMode() {
      state.settings.darkMode = !state.settings.darkMode;
      saveState();
      applyTheme();
    }

    /* =========================================================================
       6. LIVE SHIFT TIMER ("STOPER DYŻURU")
       ========================================================================= */
    function getElapsedTimerMs() {
      let ms = state.timer.accumulatedMs || 0;
      if (state.timer.running && state.timer.startTimestamp) {
        ms += Date.now() - state.timer.startTimestamp;
      }
      return Math.max(0, ms);
    }

    function formatTimerMs(ms) {
      const totalSec = Math.floor(ms / 1000);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function startTimer() {
      if (state.timer.running) return;
      if (!state.timer.sessionStartClock) {
        state.timer.sessionStartClock = formatTimeNow(new Date());
      }
      state.timer.running = true;
      state.timer.startTimestamp = Date.now();
      saveState();
      startTimerLoop();
      renderCurrentTab();
      showToast('Stoper dyżuru uruchomiony!', 'info');
    }

    function pauseTimer() {
      if (!state.timer.running) return;
      state.timer.accumulatedMs = getElapsedTimerMs();
      state.timer.running = false;
      state.timer.startTimestamp = null;
      saveState();
      updateTimerDisplays();
      renderCurrentTab();
      showToast('Stoper wstrzymany.', 'info');
    }

    function resetTimer() {
      openConfirmModal({
        title: 'Wyzerować stoper?',
        message: 'Bieżący odmierzony czas dyżuru zostanie usunięty bez zapisywania.',
        confirmText: 'Wyzeruj',
        danger: true,
        onConfirm: () => {
          state.timer = { running: false, startTimestamp: null, accumulatedMs: 0, sessionStartClock: null };
          saveState();
          updateTimerDisplays();
          renderCurrentTab();
          showToast('Stoper wyzerowany.', 'info');
        }
      });
    }

    function finishTimerAndLog() {
      const elapsedMs = getElapsedTimerMs();
      const startClock = state.timer.sessionStartClock || formatTimeNow(new Date(Date.now() - elapsedMs));
      const endClock = formatTimeNow(new Date());
      const calcHours = Math.max(0.25, Math.round((elapsedMs / 3600000) * 100) / 100);

      // Pause timer while modal is open
      if (state.timer.running) {
        state.timer.accumulatedMs = elapsedMs;
        state.timer.running = false;
        state.timer.startTimestamp = null;
        saveState();
      }

      openShiftModal({
        prefill: {
          date: formatLocalDate(new Date()),
          status: 'completed',
          startTime: startClock,
          endTime: endClock,
          breakMins: 0,
          hours: calcHours,
          manualOverride: true,
          fromTimer: true
        }
      });
    }

    function updateTimerDisplays() {
      const ms = getElapsedTimerMs();
      const formatted = formatTimerMs(ms);
      const bigEl = document.getElementById('live-timer-readout');
      if (bigEl) bigEl.textContent = formatted;

      const pill = document.getElementById('header-timer-pill');
      const pillText = document.getElementById('header-timer-text');
      if (pill && pillText) {
        if (state.timer.running || ms > 0) {
          pill.classList.remove('hidden');
          pill.classList.add('flex');
          pillText.textContent = formatted.slice(0, 5);
          if (!state.timer.running) pill.classList.remove('animate-pulse');
          else pill.classList.add('animate-pulse');
        } else {
          pill.classList.add('hidden');
          pill.classList.remove('flex');
        }
      }
    }

    function startTimerLoop() {
      if (timerIntervalId) clearInterval(timerIntervalId);
      updateTimerDisplays();
      timerIntervalId = setInterval(updateTimerDisplays, 1000);
    }

    /* =========================================================================
       7. STATS & ANALYTICS CALCULATIONS
       ========================================================================= */
    function computeStats() {
      const target = Math.max(1, Number(state.settings.targetHours) || 140);
      const completedShifts = state.shifts.filter(s => s.status === 'completed');
      const plannedShifts = state.shifts.filter(s => s.status === 'planned');

      const completedHours = Math.round(completedShifts.reduce((sum, s) => sum + (Number(s.hours) || 0), 0) * 100) / 100;
      const plannedHours = Math.round(plannedShifts.reduce((sum, s) => sum + (Number(s.hours) || 0), 0) * 100) / 100;
      const remainingHours = Math.max(0, Math.round((target - completedHours) * 100) / 100);
      const percent = Math.min(100, Math.round((completedHours / target) * 1000) / 10);

      // Unique completed days
      const uniqueDays = new Set(completedShifts.map(s => s.date)).size;
      const avgPerDay = uniqueDays > 0 ? Math.round((completedHours / uniqueDays) * 10) / 10 : 0;
      const estDaysLeft = avgPerDay > 0 && remainingHours > 0 ? Math.ceil(remainingHours / avgPerDay) : (remainingHours === 0 ? 0 : null);

      // Procedure tag frequency across completed shifts
      const tagCounts = {};
      completedShifts.forEach(s => {
        (s.tags || []).forEach(tag => {
          tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        });
      });
      const topTags = Object.entries(tagCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 6);

      return {
        target,
        completedShifts,
        plannedShifts,
        completedHours,
        plannedHours,
        remainingHours,
        percent,
        uniqueDays,
        avgPerDay,
        estDaysLeft,
        topTags
      };
    }

            ? 'text-teal-600 dark:text-teal-400 bg-teal-50/80 dark:bg-teal-900/30'
            : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200'
        }`;
      });

      // Show FAB on Pulpit & Kalendarz
      const fab = document.getElementById('fab-button');
      if (fab) {
        if (tabName === 'pulpit' || tabName === 'kalendarz') {
          fab.classList.remove('hidden');
        } else {
          fab.classList.add('hidden');
        }
      }

      const main = document.getElementById('main-content');
      if (scrollToSettings) {
        setTimeout(() => {
          const el = document.getElementById('settings-section');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 80);
      } else if (main) {
        main.scrollTop = 0;
      }
    }

    function renderCurrentTab() {
      const container = document.getElementById('main-content');
      if (!container) return;

      // Update header subtitle with clinic name if configured
      const sub = document.getElementById('header-subtitle');
      if (sub) {
        sub.textContent = state.settings.clinicName
          ? state.settings.clinicName
          : 'Asystentka stomatologiczna';
      }

      switch (ui.activeTab) {
        case 'pulpit':
          container.innerHTML = renderPulpitTab();
          break;
        case 'kalendarz':
          container.innerHTML = renderKalendarzTab();
          break;
        case 'notatki':
          container.innerHTML = renderNotatkiTab();
          break;
        case 'niezbednik':
          container.innerHTML = renderNiezbednikTab();
          break;
        case 'dzienniczek':
          container.innerHTML = renderDzienniczekTab();
          break;
      }

      if (window.lucide) lucide.createIcons();
      updateTimerDisplays();
    }

    /* =========================================================================
       9. TAB 1: PULPIT (DASHBOARD & LIVE TIMER)
       ========================================================================= */
    function renderPulpitTab() {
      const stats = computeStats();
      const radius = 64;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (stats.percent / 100) * circumference;

      const timerMs = getElapsedTimerMs();

      const milestones = [

      const isIosDevice = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

          </div>
        </div>
      ` : '';

      // Onboarding hint if no data yet
      const emptyBanner = state.shifts.length === 0 ? `
        <div class="rounded-2xl bg-sky-50 dark:bg-sky-900/25 border border-sky-200/80 dark:border-sky-800 p-4 flex items-start gap-3">
          <div class="w-9 h-9 rounded-xl bg-sky-500/15 text-sky-600 dark:text-sky-400 flex items-center justify-center shrink-0 mt-0.5">

          </div>
          <div class="flex-1 text-xs leading-relaxed text-slate-700 dark:text-slate-300">
            <p class="font-bold text-slate-900 dark:text-white text-sm mb-0.5">Witaj w DentaLog!</p>
            Dodaj swój pierwszy dyżur przyciskiem <strong>+</strong> lub uruchom stoper poniżej, aby zacząć zliczać godziny do celu ${stats.target} h.

              <button onclick="openShiftModal()" class="px-3 py-1.5 rounded-xl bg-teal-600 text-white font-semibold hover:bg-teal-700 transition-colors">
                + Dodaj dyżur

          </div>
        </div>
      ` : '';

      const maxTagCount = stats.topTags.length > 0 ? stats.topTags[0][1] : 1;

      return `
        ${iosInstallHint}
        ${emptyBanner}

        <!-- HERO PROGRESS CARD -->
        <section class="rounded-3xl bg-gradient-to-br from-teal-600 via-teal-600 to-sky-600 text-white p-5 shadow-lg shadow-teal-600/20 relative overflow-hidden">
          <!-- Decorative soft glow circles -->
          <div class="absolute -top-10 -right-10 w-36 h-36 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
          <div class="absolute -bottom-12 -left-10 w-32 h-32 bg-sky-300/20 rounded-full blur-2xl pointer-events-none"></div>

          <div class="relative z-10 flex items-center justify-between gap-4">
            <!-- Animated SVG Circular Progress Ring -->
            <div class="relative w-36 h-36 shrink-0 flex items-center justify-center">
              <svg class="w-full h-full" viewBox="0 0 150 150">
                <circle cx="75" cy="75" r="${radius}" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="11" />
                <circle cx="75" cy="75" r="${radius}" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round"
                  class="progress-ring-circle"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${offset}" />
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
                <span class="font-display font-extrabold text-2xl leading-none">${stats.percent}%</span>
                <span class="text-[11px] font-medium text-teal-100 mt-1">${formatHours(stats.completedHours)} / ${stats.target} h</span>
              </div>
            </div>

            <!-- Summary Info -->
            <div class="flex-1 min-w-0">
              <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-white/15 backdrop-blur-xs text-[11px] font-semibold mb-2">
                <i data-lucide="${stats.remainingHours === 0 ? 'award' : 'clock'}" class="w-3.5 h-3.5"></i>
                ${stats.remainingHours === 0 ? 'Praktyki zaliczone!' : 'Postęp praktyk'}
              </span>
              <h2 class="font-display font-bold text-xl leading-tight">
                ${stats.remainingHours === 0
                  ? 'Gratulacje! 100%'
                  : `Pozostało ${formatHours(stats.remainingHours)} h`}
              </h2>
              <p class="text-xs text-teal-100 mt-1.5 leading-relaxed">
                ${stats.plannedHours > 0
                  ? `Masz już zaplanowane <strong>${formatHours(stats.plannedHours)} h</strong> w grafiku.`
                  : 'Zaplanuj kolejne dyżury w kalendarzu, by szybciej osiągnąć cel.'}
              </p>
            </div>
          </div>

          <!-- Milestone Progress Bar -->
          <div class="relative z-10 mt-5 pt-4 border-t border-white/15">
            <div class="h-2 bg-white/20 rounded-full overflow-hidden mb-2.5">
              <div class="h-full bg-white rounded-full transition-all duration-700" style="width: ${stats.percent}%"></div>
            </div>
            <div class="grid grid-cols-4 gap-1 text-[10px] font-semibold">
              ${milestones.map(m => {
                const reached = stats.percent >= m.pct;
                return `
                  <div class="flex flex-col ${m.pct === 100 ? 'items-end text-right' : m.pct === 25 ? 'items-start' : 'items-center text-center'}">
                    <span class="${reached ? 'text-white' : 'text-teal-100/65'} flex items-center gap-0.5">
                      ${reached ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}${m.label}
