            </div>
          </div>
        </section>

        <!-- LIVE SHIFT TIMER ("STOPER DYŻURU") -->
        <section class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-4 shadow-soft">
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl ${state.timer.running ? 'bg-teal-100 dark:bg-teal-900/50 text-teal-600 dark:text-teal-400 animate-pulse' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'} flex items-center justify-center">
                <i data-lucide="timer" class="w-4 h-4"></i>
              </div>
              <div>
                <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white">Stoper dyżuru</h3>
                <p class="text-[11px] text-slate-500 dark:text-slate-400">
                  ${state.timer.running ? `Aktywny od ${state.timer.sessionStartClock || '--:--'}` : (timerMs > 0 ? 'Wstrzymany — gotowy do zapisu' : 'Mierz obecny dyżur na żywo')}
                </p>
              </div>
            </div>
            <div id="live-timer-readout" class="font-mono font-bold text-xl tracking-tight text-slate-900 dark:text-white bg-slate-50 dark:bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-200/70 dark:border-slate-700">
              ${formatTimerMs(timerMs)}
            </div>
          </div>

          <div class="flex items-center gap-2">
            ${!state.timer.running ? `
              <button onclick="startTimer()" class="flex-1 py-2.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center gap-1.5 transition-all">
                <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                ${timerMs > 0 ? 'Wznów' : 'Rozpocznij dyżur'}
              </button>
            ` : `
              <button onclick="pauseTimer()" class="flex-1 py-2.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center gap-1.5 transition-all">
                <i data-lucide="pause" class="w-4 h-4 fill-current"></i>
                Pauza
              </button>
            `}

            ${isTimerActive ? `
              <button onclick="finishTimerAndLog()" class="flex-1 py-2.5 px-3 rounded-xl bg-sky-600 hover:bg-sky-700 active:scale-[0.98] text-white font-semibold text-sm flex items-center justify-center gap-1.5 transition-all">
                <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                Zakończ i zapisz
              </button>
              <button onclick="resetTimer()" aria-label="Resetuj stoper" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-rose-100 hover:text-rose-600 dark:hover:bg-rose-900/40 dark:hover:text-rose-400 transition-colors">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
              </button>
            ` : ''}
          </div>
        </section>

        <!-- SMART STATS GRID (4 CARDS) -->
        <section class="grid grid-cols-2 gap-3">
          <div class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-3.5 shadow-soft">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Odbyte dni</span>
              <span class="w-7 h-7 rounded-lg bg-teal-50 dark:bg-teal-900/40 text-teal-600 dark:text-teal-400 flex items-center justify-center">
                <i data-lucide="calendar-check-2" class="w-4 h-4"></i>
              </span>
            </div>
            <p class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">${stats.uniqueDays}</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">zalogowanych dni</p>
          </div>

          <div class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-3.5 shadow-soft">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Średnio / dzień</span>
              <span class="w-7 h-7 rounded-lg bg-sky-50 dark:bg-sky-900/40 text-sky-600 dark:text-sky-400 flex items-center justify-center">
                <i data-lucide="gauge" class="w-4 h-4"></i>
              </span>
            </div>
            <p class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">${stats.avgPerDay > 0 ? formatHours(stats.avgPerDay) + ' h' : '—'}</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">czas jednego dyżuru</p>
          </div>

          <div class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-3.5 shadow-soft">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Szac. dni do końca</span>
              <span class="w-7 h-7 rounded-lg bg-amber-50 dark:bg-amber-900/40 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                <i data-lucide="hourglass" class="w-4 h-4"></i>
              </span>
            </div>
            <p class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">${stats.estDaysLeft !== null ? stats.estDaysLeft : '—'}</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">przy obecnym tempie</p>
          </div>

          <div class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-3.5 shadow-soft">
            <div class="flex items-center justify-between mb-1.5">
              <span class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">Zaplanowane</span>
              <span class="w-7 h-7 rounded-lg bg-violet-50 dark:bg-violet-900/40 text-violet-600 dark:text-violet-400 flex items-center justify-center">
                <i data-lucide="calendar-clock" class="w-4 h-4"></i>
              </span>
            </div>
            <p class="font-display font-extrabold text-2xl text-slate-900 dark:text-white">${formatHours(stats.plannedHours)} h</p>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">w przyszłym grafiku</p>
          </div>
        </section>

        <!-- TOP SKILLS / PROCEDURES BREAKDOWN -->
        <section class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-4 shadow-soft">
          <div class="flex items-center justify-between mb-3.5">
            <div>
              <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white">Najczęstsze zabiegi i zadania</h3>
              <p class="text-[11px] text-slate-500 dark:text-slate-400">Podsumowanie Twojego doświadczenia z dyżurów</p>
            </div>
            <i data-lucide="bar-chart-3" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i>
          </div>

          ${stats.topTags.length === 0 ? `
            <div class="text-center py-5 px-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 border border-dashed border-slate-200 dark:border-slate-700">
              <p class="text-xs text-slate-500 dark:text-slate-400">Dodaj dyżury z tagami zabiegów (np. <em>Praca na 4 ręce</em>, <em>Sterylizacja</em>), aby zobaczyć swój profil umiejętności.</p>
            </div>
          ` : `
            <div class="space-y-3">
              ${stats.topTags.map(([tag, count]) => {
                const widthPct = Math.max(12, Math.round((count / maxTagCount) * 100));
                return `
                  <div>
                    <div class="flex items-center justify-between text-xs mb-1">
                      <span class="font-medium text-slate-700 dark:text-slate-200 truncate pr-2">${escapeHtml(tag)}</span>
                      <span class="font-bold text-teal-600 dark:text-teal-400 shrink-0">${count}×</span>
                    </div>
                    <div class="h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
                      <div class="h-full bg-gradient-to-r from-teal-500 to-sky-500 rounded-full transition-all duration-500" style="width: ${widthPct}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </section>
      `;
    }

    /* =========================================================================
       10. TAB 2: KALENDARZ (INTERACTIVE CALENDAR & SHIFT LOGGER)
       ========================================================================= */
    function changeCalendarMonth(delta) {
      let m = ui.calMonth + delta;
      let y = ui.calYear;
      if (m < 0) { m = 11; y -= 1; }
      if (m > 11) { m = 0; y += 1; }
      ui.calMonth = m;
      ui.calYear = y;
      renderCurrentTab();
    }

    function jumpToToday() {
      const now = new Date();
      ui.calYear = now.getFullYear();
      ui.calMonth = now.getMonth();
      renderCurrentTab();
    }

    function renderKalendarzTab() {
      const year = ui.calYear;
      const month = ui.calMonth;
      const todayStr = formatLocalDate(new Date());

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      // Convert JS Sunday=0..Saturday=6 into Monday=0..Sunday=6
      const startOffset = (firstDay.getDay() + 6) % 7;

      // Group shifts by date string
      const shiftsByDate = {};
      state.shifts.forEach(s => {
        if (!shiftsByDate[s.date]) shiftsByDate[s.date] = [];
        shiftsByDate[s.date].push(s);
      });

      // Build day cells
      let cellsHtml = '';
      for (let i = 0; i < startOffset; i++) {
        cellsHtml += `<div class="h-14 rounded-xl"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayShifts = shiftsByDate[dateStr] || [];
        const isToday = dateStr === todayStr;

        const completedHrs = dayShifts.filter(s => s.status === 'completed').reduce((sum, s) => sum + (Number(s.hours) || 0), 0);
        const plannedHrs = dayShifts.filter(s => s.status === 'planned').reduce((sum, s) => sum + (Number(s.hours) || 0), 0);
        const hasNote = dayShifts.some(s => s.note && s.note.trim().length > 0);

        let badgeHtml = '';
        if (completedHrs > 0) {
          badgeHtml = `<span class="mt-0.5 px-1.5 py-0.5 rounded-md bg-teal-600 text-white text-[9px] font-bold leading-none">${formatHours(completedHrs)}h</span>`;
        } else if (plannedHrs > 0) {
          badgeHtml = `<span class="mt-0.5 px-1.5 py-0.5 rounded-md bg-sky-50 dark:bg-sky-900/40 text-sky-600 dark:text-sky-300 border border-dashed border-sky-400 text-[9px] font-bold leading-none">${formatHours(plannedHrs)}h</span>`;
        }

        cellsHtml += `
          <button onclick="handleCalendarDayClick('${dateStr}')" class="relative h-14 rounded-xl flex flex-col items-center justify-start pt-1.5 transition-all active:scale-95 ${
            isToday
              ? 'bg-teal-50/90 dark:bg-teal-900/30 ring-2 ring-teal-500 font-bold'
              : 'hover:bg-slate-100 dark:hover:bg-slate-800/80'
          }">
            <span class="text-xs ${isToday ? 'text-teal-700 dark:text-teal-300 font-extrabold' : 'text-slate-700 dark:text-slate-200 font-semibold'}">${day}</span>
            ${badgeHtml}
            ${hasNote ? '<span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 rounded-full bg-amber-400"></span>' : ''}
          </button>
        `;
      }

      // Filter shifts belonging to the currently viewed month
      const monthPrefix = `${year}-${String(month + 1).padStart(2, '0')}-`;
      const monthShifts = state.shifts
        .filter(s => s.date.startsWith(monthPrefix))
        .sort((a, b) => a.date.localeCompare(b.date));

      const monthCompletedTotal = Math.round(monthShifts.filter(s => s.status === 'completed').reduce((acc, s) => acc + (Number(s.hours) || 0), 0) * 100) / 100;
      const monthPlannedTotal = Math.round(monthShifts.filter(s => s.status === 'planned').reduce((acc, s) => acc + (Number(s.hours) || 0), 0) * 100) / 100;

      return `
        <!-- CALENDAR CARD -->
        <section class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-4 shadow-soft">
          <!-- Month Header -->
          <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-1">
              <button onclick="changeCalendarMonth(-1)" aria-label="Poprzedni miesiąc" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300">
                <i data-lucide="chevron-left" class="w-5 h-5"></i>
              </button>
              <h2 class="font-display font-bold text-base text-slate-900 dark:text-white min-w-[140px] text-center">
                ${POLISH_MONTHS[month]} ${year}
              </h2>
              <button onclick="changeCalendarMonth(1)" aria-label="Następny miesiąc" class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300">
                <i data-lucide="chevron-right" class="w-5 h-5"></i>
              </button>
            </div>
            <button onclick="jumpToToday()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 hover:bg-teal-100 dark:hover:bg-teal-900/40 text-xs font-semibold text-slate-700 dark:text-slate-200 transition-colors">
              Dziś
            </button>
          </div>

          <!-- Weekday Labels -->
          <div class="grid grid-cols-7 gap-1 mb-1.5">
            ${POLISH_WEEKDAYS.map((w, idx) => `
              <div class="text-center text-[11px] font-semibold ${idx >= 5 ? 'text-rose-400 dark:text-rose-400/80' : 'text-slate-400 dark:text-slate-500'}">${w}</div>
            `).join('')}
          </div>

          <!-- Days Grid -->
          <div class="grid grid-cols-7 gap-1">
            ${cellsHtml}
          </div>

          <!-- Legend -->
          <div class="mt-4 pt-3 border-t border-slate-100 dark:border-slate-700/70 flex flex-wrap items-center justify-between gap-2 text-[11px] text-slate-500 dark:text-slate-400">
            <div class="flex items-center gap-3">
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-teal-600"></span> Odbyte</span>
              <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded bg-sky-50 dark:bg-sky-900/40 border border-dashed border-sky-400"></span> Zaplanowane</span>
              <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-amber-400"></span> Notatka</span>
            </div>
            <span class="font-medium text-slate-400">Kliknij dzień</span>
          </div>
        </section>

        <!-- MONTHLY SUMMARY & CHRONOLOGICAL LIST -->
        <section class="space-y-3">
          <div class="flex items-center justify-between px-1">
            <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white">
              Dyżury — ${POLISH_MONTHS[month]}
            </h3>
            <div class="flex items-center gap-2 text-xs">
              <span class="px-2.5 py-1 rounded-full bg-teal-100 dark:bg-teal-900/40 text-teal-700 dark:text-teal-300 font-bold">
                Odbyte: ${formatHours(monthCompletedTotal)} h
              </span>
              ${monthPlannedTotal > 0 ? `
                <span class="px-2.5 py-1 rounded-full bg-sky-100 dark:bg-sky-900/40 text-sky-700 dark:text-sky-300 font-semibold">
                  Plan: ${formatHours(monthPlannedTotal)} h
                </span>
              ` : ''}
            </div>
          </div>

          ${monthShifts.length === 0 ? `
            <div class="rounded-2xl bg-white dark:bg-slate-800/60 border border-dashed border-slate-300 dark:border-slate-700 p-6 text-center">
              <i data-lucide="calendar-plus" class="w-8 h-8 mx-auto text-slate-400 mb-2"></i>
              <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">Brak wpisów w tym miesiącu</p>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Kliknij dowolny dzień w kalendarzu powyżej, aby dodać odbyte lub zaplanowane godziny.</p>
            </div>
          ` : `
            <div class="space-y-2.5">
              ${monthShifts.map(shift => renderShiftCard(shift)).join('')}
            </div>
          `}
        </section>
      `;
    }

    function renderShiftCard(shift) {
      const isPlanned = shift.status === 'planned';
      return `
        <div onclick="openShiftModal({ editId: '${shift.id}' })" class="cursor-pointer rounded-2xl bg-white dark:bg-slate-800/80 border ${isPlanned ? 'border-dashed border-sky-300 dark:border-sky-700' : 'border-slate-200/80 dark:border-slate-700/80'} p-3.5 shadow-soft hover:border-teal-400 dark:hover:border-teal-500 transition-all active:scale-[0.99]">
          <div class="flex items-start justify-between gap-2">
            <div class="flex items-center gap-2.5">
              <div class="w-11 h-11 rounded-xl flex flex-col items-center justify-center shrink-0 ${isPlanned ? 'bg-sky-50 dark:bg-sky-900/30 text-sky-600 dark:text-sky-300' : 'bg-teal-50 dark:bg-teal-900/40 text-teal-700 dark:text-teal-300'}">
                <span class="font-display font-extrabold text-sm leading-none">${formatHours(shift.hours)}h</span>
                <span class="text-[9px] font-semibold uppercase mt-0.5">${isPlanned ? 'Plan' : 'OK'}</span>
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-sm text-slate-900 dark:text-white">${formatDisplayDate(shift.date)}</span>
                  <span class="text-xs text-slate-500 dark:text-slate-400 font-medium">${shift.startTime || '--:--'} – ${shift.endTime || '--:--'}</span>
                </div>
                ${shift.breakMins > 0 ? `<p class="text-[11px] text-slate-400">w tym przerwa: ${shift.breakMins} min</p>` : ''}
              </div>
            </div>
            <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 mt-1 shrink-0"></i>
          </div>

          ${(shift.tags && shift.tags.length > 0) ? `
            <div class="mt-2.5 flex flex-wrap gap-1.5">
              ${shift.tags.map(t => `<span class="px-2 py-0.5 rounded-lg bg-slate-100 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300 text-[10px] font-semibold">${escapeHtml(t)}</span>`).join('')}
            </div>
          ` : ''}

          ${shift.note ? `
            <p class="mt-2 text-xs text-slate-600 dark:text-slate-300 line-clamp-2 bg-slate-50 dark:bg-slate-900/50 rounded-xl px-2.5 py-1.5 border border-slate-100 dark:border-slate-700/50">
              ${escapeHtml(shift.note)}
            </p>
          ` : ''}
        </div>
      `;
    }

    function handleCalendarDayClick(dateStr) {
      const dayShifts = state.shifts.filter(s => s.date === dateStr);
      if (dayShifts.length === 0) {
        openShiftModal({ prefill: { date: dateStr } });
      } else {
        openDaySummarySheet(dateStr, dayShifts);
      }
    }

    function openDaySummarySheet(dateStr, dayShifts) {
      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[85vh] overflow-y-auto animate-slide-up border-t sm:border border-slate-200 dark:border-slate-800">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white">Dzień ${formatDisplayDate(dateStr)}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Zapisane dyżury (${dayShifts.length})</p>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-white">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <div class="space-y-2.5 mb-4">
            ${dayShifts.map(s => `
              <div class="rounded-2xl border ${s.status === 'planned' ? 'border-dashed border-sky-300 dark:border-sky-700' : 'border-slate-200 dark:border-slate-700'} p-3.5 bg-slate-50 dark:bg-slate-800/60">
                <div class="flex items-center justify-between mb-1.5">
                  <span class="font-bold text-sm text-slate-900 dark:text-white">
                    ${s.startTime} – ${s.endTime} <span class="text-teal-600 dark:text-teal-400 ml-1">(${formatHours(s.hours)} h)</span>
                  </span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${s.status === 'planned' ? 'bg-sky-100 text-sky-700 dark:bg-sky-900/50 dark:text-sky-300' : 'bg-teal-100 text-teal-700 dark:bg-teal-900/50 dark:text-teal-300'}">
                    ${s.status === 'planned' ? 'Zaplanowane' : 'Odbyte'}
                  </span>
                </div>
                ${s.note ? `<p class="text-xs text-slate-600 dark:text-slate-300 mb-2.5">${escapeHtml(s.note)}</p>` : ''}
                <div class="flex items-center gap-2 pt-2 border-t border-slate-200/70 dark:border-slate-700">
                  ${s.status === 'planned' ? `
                    <button onclick="markShiftCompleted('${s.id}')" class="flex-1 py-2 px-3 rounded-xl bg-teal-600 text-white text-xs font-semibold hover:bg-teal-700 flex items-center justify-center gap-1">
                      <i data-lucide="check" class="w-3.5 h-3.5"></i> Oznacz jako odbyte
                    </button>
                  ` : ''}
                  <button onclick="openShiftModal({ editId: '${s.id}' })" class="flex-1 py-2 px-3 rounded-xl bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200 text-xs font-semibold hover:bg-slate-100">
                    Edytuj wpis
                  </button>
                </div>
              </div>
            `).join('')}
          </div>

          <button onclick="openShiftModal({ prefill: { date: '${dateStr}' } })" class="w-full py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-semibold text-sm flex items-center justify-center gap-1.5">
            <i data-lucide="plus" class="w-4 h-4"></i> Dodaj kolejny wpis w tym dniu
          </button>
        </div>
      `;
      showModal();
    }

    function markShiftCompleted(id) {
      const shift = state.shifts.find(s => s.id === id);
      if (shift) {
        shift.status = 'completed';
        saveState();
        closeModal();
        renderCurrentTab();
        showToast('Dyżur zaliczony do przepracowanych godzin!', 'success');
      }
    }

    /* =========================================================================
       11. ADD / EDIT SHIFT MODAL
       ========================================================================= */
    function openShiftModal(options = {}) {
      const { editId = null, prefill = {} } = options;
      const existing = editId ? state.shifts.find(s => s.id === editId) : null;

      const todayStr = formatLocalDate(new Date());
      const dateVal = existing ? existing.date : (prefill.date || todayStr);
      // Default to 'planned' if picking a future date, else 'completed'
      const defaultStatus = dateVal > todayStr ? 'planned' : 'completed';
      const statusVal = existing ? existing.status : (prefill.status || defaultStatus);
      const startVal = existing ? existing.startTime : (prefill.startTime || '08:00');
      const endVal = existing ? existing.endTime : (prefill.endTime || '14:00');
      const breakVal = existing ? (existing.breakMins ?? 0) : (prefill.breakMins ?? 0);
      const hoursVal = existing ? existing.hours : (prefill.hours ?? calculateHoursFromRange(startVal, endVal, breakVal));
      const selectedTags = existing ? [...(existing.tags || [])] : [];
      const noteVal = existing ? (existing.note || '') : '';
      const fromTimer = Boolean(prefill.fromTimer);

      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[92vh] overflow-y-auto animate-slide-up border-t sm:border border-slate-200 dark:border-slate-800">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white">
                ${existing ? 'Edytuj dyżur' : (fromTimer ? 'Zapisz dyżur ze stopera' : 'Nowy dyżur praktyk')}
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Wpisz godziny oraz wykonane czynności</p>
            </div>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-white">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <form id="shift-form" onsubmit="saveShiftForm(event, '${editId || ''}', ${fromTimer})" class="space-y-4">
            <!-- Status Toggle -->
            <div class="grid grid-cols-2 gap-2 p-1 rounded-2xl bg-slate-100 dark:bg-slate-800">
              <label class="cursor-pointer">
                <input type="radio" name="status" value="completed" ${statusVal === 'completed' ? 'checked' : ''} class="peer sr-only" />
                <div class="py-2.5 px-3 rounded-xl text-center text-xs font-bold text-slate-600 dark:text-slate-400 peer-checked:bg-teal-600 peer-checked:text-white peer-checked:shadow-xs transition-all">
                  Odbyte (do 140 h)
                </div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="status" value="planned" ${statusVal === 'planned' ? 'checked' : ''} class="peer sr-only" />
                <div class="py-2.5 px-3 rounded-xl text-center text-xs font-bold text-slate-600 dark:text-slate-400 peer-checked:bg-sky-600 peer-checked:text-white peer-checked:shadow-xs transition-all">
                  Zaplanowane (grafik)
                </div>
              </label>
            </div>

            <!-- Date & Manual Hours -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Data</label>
                <input type="date" id="sf-date" required value="${dateVal}" class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Łącznie godzin</label>
                <input type="number" id="sf-hours" step="0.25" min="0.25" max="24" required value="${hoursVal}" class="w-full px-3 py-2.5 rounded-xl bg-teal-50/70 dark:bg-teal-900/30 border border-teal-200 dark:border-teal-700 text-sm font-extrabold text-teal-800 dark:text-teal-300 focus:outline-none focus:ring-2 focus:ring-teal-500" />
              </div>
            </div>

            <!-- Time Range + Break -->
            <div class="grid grid-cols-3 gap-2.5">
              <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Start</label>
                <input type="time" id="sf-start" value="${startVal}" oninput="recalcShiftFormHours()" class="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Koniec</label>
                <input type="time" id="sf-end" value="${endVal}" oninput="recalcShiftFormHours()" class="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">Przerwa (min)</label>
                <input type="number" id="sf-break" min="0" max="240" step="5" value="${breakVal}" oninput="recalcShiftFormHours()" class="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500" />
              </div>
            </div>

            <!-- Dental Procedure Tags -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-2">Wykonywane zabiegi i czynności</label>
              <div id="sf-tags-wrap" class="flex flex-wrap gap-1.5">
                ${PROCEDURE_TAGS.map(tag => {
                  const active = selectedTags.includes(tag);
                  return `
                    <button type="button" data-tag="${escapeHtml(tag)}" onclick="toggleShiftTagBtn(this)" class="shift-tag-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition-all ${
                      active
                        ? 'bg-teal-600 text-white border-teal-600 shadow-xs'
                        : 'bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-teal-400'
                    }">
                      ${escapeHtml(tag)}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Daily Note / Logbook Description -->
            <div>
              <div class="flex items-center justify-between mb-1.5">
                <label class="text-xs font-semibold text-slate-600 dark:text-slate-300">Opis do dzienniczka / notatka</label>
                <button type="button" onclick="generateLogbookDescription()" class="inline-flex items-center gap-1 text-[11px] font-bold text-teal-600 dark:text-teal-400 hover:underline">
                  <i data-lucide="wand-2" class="w-3.5 h-3.5"></i> Wstaw wybrane tagi do opisu
                </button>
              </div>
              <textarea id="sf-note" rows="3" placeholder="Np. Asystowanie przy leczeniu zachowawczym zęba 16, przygotowanie kompozytu, pakietowanie i cykl autoklawu..." class="w-full px-3 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">${escapeHtml(noteVal)}</textarea>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 pt-2">
              ${existing ? `
                <button type="button" onclick="confirmDeleteShift('${existing.id}')" class="p-3 rounded-xl bg-rose-50 dark:bg-rose-900/30 text-rose-600 dark:text-rose-400 hover:bg-rose-100 transition-colors" aria-label="Usuń dyżur">
                  <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
              ` : ''}
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-sm hover:bg-slate-200 dark:hover:bg-slate-700">
                Anuluj
              </button>
              <button type="submit" class="flex-[1.6] py-3 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-[0.99] text-white font-bold text-sm shadow-md shadow-teal-600/20">
                ${existing ? 'Zapisz zmiany' : 'Zapisz dyżur'}
              </button>
            </div>
          </form>
        </div>
      `;
      showModal();
    }

    function recalcShiftFormHours() {
      const start = document.getElementById('sf-start')?.value;
      const end = document.getElementById('sf-end')?.value;
      const brk = Number(document.getElementById('sf-break')?.value || 0);
      const calc = calculateHoursFromRange(start, end, brk);
      const hrsInput = document.getElementById('sf-hours');
      if (hrsInput && calc > 0) {
        hrsInput.value = calc;
      }
    }

    function toggleShiftTagBtn(btn) {
      const active = btn.classList.contains('bg-teal-600');
      if (active) {
        btn.className = 'shift-tag-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition-all bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-teal-400';
      } else {
        btn.className = 'shift-tag-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold border transition-all bg-teal-600 text-white border-teal-600 shadow-xs';
      }
    }

    function generateLogbookDescription() {
      const activeBtns = Array.from(document.querySelectorAll('#sf-tags-wrap .shift-tag-btn.bg-teal-600'));
      if (activeBtns.length === 0) {
        showToast('Najpierw zaznacz przynajmniej jeden tag powyżej.', 'info');
        return;
      }
      const tags = activeBtns.map(b => b.dataset.tag.toLowerCase());
      let joined = '';
      if (tags.length === 1) {
        joined = tags[0];
      } else {
        joined = tags.slice(0, -1).join(', ') + ' oraz ' + tags[tags.length - 1];
      }
      const sentence = `Czynności asystenckie podczas dyżuru: ${joined}.`;
      const textarea = document.getElementById('sf-note');
      if (textarea) {
        textarea.value = textarea.value.trim() ? `${textarea.value.trim()} ${sentence}` : sentence;
      }
    }

    function saveShiftForm(event, editId, fromTimer) {
      event.preventDefault();
      const date = document.getElementById('sf-date').value;
      const status = document.querySelector('#shift-form input[name="status"]:checked').value;
      const startTime = document.getElementById('sf-start').value;
      const endTime = document.getElementById('sf-end').value;
      const breakMins = Number(document.getElementById('sf-break').value || 0);
      const hours = parseFloat(document.getElementById('sf-hours').value);
      const note = document.getElementById('sf-note').value.trim();
      const tags = Array.from(document.querySelectorAll('#sf-tags-wrap .shift-tag-btn.bg-teal-600')).map(b => b.dataset.tag);

      if (!date || isNaN(hours) || hours <= 0) {
        showToast('Podaj poprawną datę oraz liczbę godzin.', 'error');
        return;
      }

      if (editId) {
        const idx = state.shifts.findIndex(s => s.id === editId);
        if (idx !== -1) {
          state.shifts[idx] = { ...state.shifts[idx], date, status, startTime, endTime, breakMins, hours, tags, note };
        }
        showToast('Dyżur został zaktualizowany!', 'success');
      } else {
        state.shifts.push({
          id: generateId(),
          date,
          status,
          startTime,
          endTime,
          breakMins,
          hours,
          tags,
          note
        });
        showToast(status === 'completed' ? `Dodano ${formatHours(hours)} h do praktyk!` : 'Zaplanowano dyżur w kalendarzu!', 'success');
      }

      if (fromTimer) {
        state.timer = { running: false, startTimestamp: null, accumulatedMs: 0, sessionStartClock: null };
      }

      saveState();
      closeModal();
      renderCurrentTab();
    }

    function confirmDeleteShift(id) {
      openConfirmModal({
        title: 'Usunąć wpis dyżuru?',
        message: 'Tej operacji nie można cofnąć. Godziny zostaną odjęte od podsumowania.',
        confirmText: 'Usuń wpis',
        danger: true,
        onConfirm: () => {
          state.shifts = state.shifts.filter(s => s.id !== id);
          saveState();
          closeModal();
          renderCurrentTab();
          showToast('Wpis został usunięty.', 'info');
        }
      });
    }

    /* =========================================================================
       12. TAB 3: NOTATKI (INTERNSHIP NOTEBOOK)
       ========================================================================= */
    function renderNotatkiTab() {
      const searchLower = ui.noteSearch.toLowerCase().trim();
      const filteredNotes = state.notes
        .filter(n => ui.noteFilter === 'Wszystkie' || n.category === ui.noteFilter)
        .filter(n => !searchLower || n.title.toLowerCase().includes(searchLower) || n.content.toLowerCase().includes(searchLower))
        .sort((a, b) => {
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          return (b.updatedAt || 0) - (a.updatedAt || 0);
        });

      const getCatBadge = (catId) => {
        const found = NOTE_CATEGORIES.find(c => c.id === catId);
        return found ? found.badge : NOTE_CATEGORIES[0].badge;
      };

      return `
        <!-- Top Header & Add Note -->
        <div class="flex items-center justify-between gap-2">
          <div>
            <h2 class="font-display font-bold text-lg text-slate-900 dark:text-white">Notatnik z praktyk</h2>
            <p class="text-xs text-slate-500 dark:text-slate-400">Proporcje mas, preferencje lekarzy i pytania</p>
          </div>
          <button onclick="openNoteModal()" class="px-3.5 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 active:scale-95 text-white text-xs font-bold flex items-center gap-1.5 shadow-sm transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i> Nowa
          </button>
        </div>

        <!-- Search Input -->
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input type="text" value="${escapeHtml(ui.noteSearch)}" oninput="ui.noteSearch = this.value; renderCurrentTab();" placeholder="Szukaj w notatkach..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
        </div>

        <!-- Category Filter Pills -->
        <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1">
          ${NOTE_CATEGORIES.map(c => {
            const active = ui.noteFilter === c.id;
            return `
              <button onclick="ui.noteFilter = '${c.id}'; renderCurrentTab();" class="shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${
                active
                  ? 'bg-teal-600 text-white shadow-xs'
                  : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:border-teal-400'
              }">
                ${c.label}
              </button>
            `;
          }).join('')}
        </div>

        <!-- Notes List -->
        ${filteredNotes.length === 0 ? `
          <div class="rounded-2xl bg-white dark:bg-slate-800/60 border border-dashed border-slate-300 dark:border-slate-700 p-8 text-center">
            <i data-lucide="notebook-pen" class="w-9 h-9 mx-auto text-slate-400 mb-2"></i>
            <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">Brak notatek do wyświetlenia</p>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Zapisuj tu wskazówki z gabinetu, kolejność podawania narzędzi lub pytania do opiekuna praktyk.</p>
          </div>
        ` : `
          <div class="space-y-3">
            ${filteredNotes.map(note => {
              const dt = new Date(note.updatedAt || Date.now());
              const timeStr = `${formatDisplayDate(formatLocalDate(dt))}, ${formatTimeNow(dt)}`;
              return `
                <article class="rounded-2xl bg-white dark:bg-slate-800/80 border ${note.pinned ? 'border-teal-400/80 dark:border-teal-600/80 ring-1 ring-teal-500/20' : 'border-slate-200/80 dark:border-slate-700/80'} p-4 shadow-soft">
                  <div class="flex items-start justify-between gap-2 mb-2">
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold ${getCatBadge(note.category)}">${escapeHtml(note.category)}</span>
                      ${note.pinned ? '<span class="inline-flex items-center gap-0.5 text-[10px] font-bold text-teal-600 dark:text-teal-400"><i data-lucide="pin" class="w-3 h-3"></i> Przypięta</span>' : ''}
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                      <button onclick="togglePinNote('${note.id}')" aria-label="Przypnij notatkę" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 ${note.pinned ? 'text-teal-600 dark:text-teal-400' : 'text-slate-400'}">
                        <i data-lucide="pin" class="w-4 h-4"></i>
                      </button>
                      <button onclick="openNoteModal('${note.id}')" aria-label="Edytuj notatkę" class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-400 hover:text-slate-700 dark:hover:text-white">
                        <i data-lucide="pencil" class="w-4 h-4"></i>
                      </button>
                      <button onclick="confirmDeleteNote('${note.id}')" aria-label="Usuń notatkę" class="p-1.5 rounded-lg hover:bg-rose-50 dark:hover:bg-rose-900/30 text-slate-400 hover:text-rose-600">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </div>
                  <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white mb-1">${escapeHtml(note.title)}</h3>
                  <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">${escapeHtml(note.content)}</p>
                  <p class="text-[10px] text-slate-400 mt-2.5 flex items-center gap-1">
                    <i data-lucide="clock" class="w-3 h-3"></i> ${timeStr}
                  </p>
                </article>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    function openNoteModal(editId = null) {
      const existing = editId ? state.notes.find(n => n.id === editId) : null;
      const cats = NOTE_CATEGORIES.filter(c => c.id !== 'Wszystkie');

      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto animate-slide-up border-t sm:border border-slate-200 dark:border-slate-800">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-display font-bold text-lg text-slate-900 dark:text-white">
              ${existing ? 'Edytuj notatkę' : 'Nowa notatka'}
            </h3>
            <button onclick="closeModal()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <form onsubmit="saveNoteForm(event, '${editId || ''}')" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Tytuł</label>
              <input type="text" id="nf-title" required placeholder="Np. Ulubiony kompozyt dr Kowalskiej" value="${escapeHtml(existing?.title || '')}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Kategoria</label>
              <select id="nf-category" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-teal-500">
                ${cats.map(c => `<option value="${c.id}" ${existing?.category === c.id ? 'selected' : ''}>${c.label}</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Treść notatki</label>
              <textarea id="nf-content" rows="5" required placeholder="Wpisz proporcje, kroki zabiegu lub ważne wskazówki..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">${escapeHtml(existing?.content || '')}</textarea>
            </div>

            <label class="flex items-center gap-2.5 cursor-pointer select-none">
              <input type="checkbox" id="nf-pinned" ${existing?.pinned ? 'checked' : ''} class="w-4 h-4 rounded accent-teal-600" />
              <span class="text-xs font-semibold text-slate-700 dark:text-slate-300">Przypnij notatkę na górze listy</span>
            </label>

            <div class="flex items-center gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-sm">Anuluj</button>
              <button type="submit" class="flex-[1.5] py-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm">Zapisz notatkę</button>
            </div>
          </form>
        </div>
      `;
      showModal();
    }

    function saveNoteForm(event, editId) {
      event.preventDefault();
      const title = document.getElementById('nf-title').value.trim();
      const category = document.getElementById('nf-category').value;
      const content = document.getElementById('nf-content').value.trim();
      const pinned = document.getElementById('nf-pinned').checked;

      if (!title || !content) return;

      if (editId) {
        const idx = state.notes.findIndex(n => n.id === editId);
        if (idx !== -1) {
          state.notes[idx] = { ...state.notes[idx], title, category, content, pinned, updatedAt: Date.now() };
        }
        showToast('Notatka zaktualizowana!', 'success');
      } else {
        state.notes.unshift({
          id: generateId(),
          title,
          category,
          content,
          pinned,
          updatedAt: Date.now()
        });
        showToast('Dodano nową notatkę!', 'success');
      }

      saveState();
      closeModal();
      renderCurrentTab();
    }

    function togglePinNote(id) {
      const note = state.notes.find(n => n.id === id);
      if (note) {
        note.pinned = !note.pinned;
        saveState();
        renderCurrentTab();
      }
    }

    function confirmDeleteNote(id) {
      openConfirmModal({
        title: 'Usunąć notatkę?',
        message: 'Czy na pewno chcesz trwale usunąć tę notatkę?',
        confirmText: 'Usuń',
        danger: true,
        onConfirm: () => {
          state.notes = state.notes.filter(n => n.id !== id);
          saveState();
          renderCurrentTab();
          showToast('Notatka usunięta.', 'info');
        }
      });
    }

    /* =========================================================================
       13. TAB 4: NIEZBĘDNIK (FDI TOOTH CHART, ABBREVIATIONS, CHECKLIST, KITS)
       ========================================================================= */
    function renderNiezbednikTab() {
      const sections = [
        { id: 'fdi', label: 'Diagram FDI', icon: 'grid-2x2' },
        { id: 'skroty', label: 'Skróty w karcie', icon: 'book-a' },
        { id: 'sterylizacja', label: 'Sterylizacja', icon: 'shield-check' },
        { id: 'zestawy', label: 'Zestawy i masy', icon: 'briefcase-medical' }
      ];

      let bodyHtml = '';
      if (ui.toolSection === 'fdi') bodyHtml = renderFdiChartSection();
      else if (ui.toolSection === 'skroty') bodyHtml = renderAbbreviationsSection();
      else if (ui.toolSection === 'sterylizacja') bodyHtml = renderChecklistSection();
      else bodyHtml = renderKitsSection();

      return `
        <div>
          <h2 class="font-display font-bold text-lg text-slate-900 dark:text-white">Niezbędnik asystentki</h2>
          <p class="text-xs text-slate-500 dark:text-slate-400">Ściągawki kliniczne zawsze pod ręką w gabinecie</p>
        </div>

        <!-- Sub-navigation Pills -->
        <div class="grid grid-cols-2 gap-2">
          ${sections.map(sec => {
            const active = ui.toolSection === sec.id;
            return `
              <button onclick="ui.toolSection = '${sec.id}'; renderCurrentTab();" class="flex items-center justify-center gap-2 py-2.5 px-3 rounded-2xl text-xs font-bold transition-all ${
                active
                  ? 'bg-teal-600 text-white shadow-md shadow-teal-600/20'
                  : 'bg-white dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 border border-slate-200/80 dark:border-slate-700 hover:border-teal-400'
              }">
                <i data-lucide="${sec.icon}" class="w-4 h-4"></i>
                ${sec.label}
              </button>
            `;
          }).join('')}
        </div>

        ${bodyHtml}
      `;
    }

    function renderToothButton(code) {
      const selected = String(ui.selectedTooth) === String(code);
      const pos = parseInt(String(code)[1], 10);
      const isMolar = pos >= 6 || (parseInt(String(code)[0], 10) >= 5 && pos >= 4);
      const iconPath = isMolar
        ? 'M4 7c0-2 1.5-3 3.5-3 1 0 1.8.4 2.5.4s1.5-.4 2.5-.4C14.5 4 16 5 16 7c0 2.5-.8 4.5-1.5 7-.3 1-.7 2-1.5 2s-1.2-1.5-1.8-2.2c-.4-.5-.9-.6-1.2-.6s-.8.1-1.2.6C8.2 14.5 7.8 16 7 16s-1.2-1-1.5-2C4.8 11.5 4 9.5 4 7z'
        : 'M6 6.5C6 4.5 7.8 3.5 10 3.5s4 1 4 3c0 2.4-.7 4.8-1.4 7.3-.4 1.3-1 2.2-1.6 2.2s-.6-.6-1-.6-.4.6-1 .6-1.2-.9-1.6-2.2C6.7 11.3 6 8.9 6 6.5z';

      return `
        <button onclick="selectFdiTooth('${code}')" class="flex flex-col items-center justify-center py-1.5 px-1 rounded-xl border transition-all active:scale-95 ${
          selected
            ? 'bg-teal-600 text-white border-teal-600 shadow-md shadow-teal-600/30 scale-[1.03]'
            : 'bg-slate-50 dark:bg-slate-900/70 text-slate-700 dark:text-slate-200 border-slate-200/80 dark:border-slate-700 hover:border-teal-400'
        }">
          <svg class="w-4 h-4 mb-0.5 ${selected ? 'text-teal-100' : 'text-teal-500/80'}" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="${iconPath}" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span class="text-[11px] font-extrabold leading-none">${code}</span>
        </button>
      `;
    }

    function selectFdiTooth(code) {
      ui.selectedTooth = String(code);
      renderCurrentTab();
    }

    function switchFdiMode(mode) {
      ui.fdiMode = mode;
      ui.selectedTooth = mode === 'permanent' ? '16' : '54';
      renderCurrentTab();
    }

    function renderFdiChartSection() {
      const isPerm = ui.fdiMode === 'permanent';
      const info = getToothInfo(ui.selectedTooth);

      // Standard dental chart orientation: Patient's Right on LEFT side of screen, Patient's Left on RIGHT side
      const qTopLeft = isPerm
        ? { title: 'Prawa góra (1x)', row1: [14, 13, 12, 11], row2: [18, 17, 16, 15] }
        : { title: 'Prawa góra (5x)', row1: [53, 52, 51], row2: [55, 54] };
      const qTopRight = isPerm
        ? { title: 'Lewa góra (2x)', row1: [21, 22, 23, 24], row2: [25, 26, 27, 28] }
        : { title: 'Lewa góra (6x)', row1: [61, 62, 63], row2: [64, 65] };
      const qBotLeft = isPerm
        ? { title: 'Prawa dół (4x)', row1: [48, 47, 46, 45], row2: [44, 43, 42, 41] }
        : { title: 'Prawa dół (8x)', row1: [85, 84], row2: [83, 82, 81] };
      const qBotRight = isPerm
        ? { title: 'Lewa dół (3x)', row1: [35, 36, 37, 38], row2: [31, 32, 33, 34] }
        : { title: 'Lewa dół (7x)', row1: [74, 75], row2: [71, 72, 73] };

      const gridCols = isPerm ? 'grid-cols-4' : 'grid-cols-3';

      return `
        <section class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-4 shadow-soft space-y-4">
          <!-- Permanent / Deciduous Toggle -->
          <div class="grid grid-cols-2 gap-1.5 p-1 rounded-xl bg-slate-100 dark:bg-slate-900">
            <button onclick="switchFdiMode('permanent')" class="py-2 rounded-lg text-xs font-bold transition-all ${isPerm ? 'bg-white dark:bg-slate-800 text-teal-600 dark:text-teal-400 shadow-xs' : 'text-slate-500'}">
              Zęby stałe (1–4)
            </button>
            <button onclick="switchFdiMode('deciduous')" class="py-2 rounded-lg text-xs font-bold transition-all ${!isPerm ? 'bg-white dark:bg-slate-800 text-teal-600 dark:text-teal-400 shadow-xs' : 'text-slate-500'}">
              Zęby mleczne (5–8)
            </button>
          </div>

          <!-- Orientation Helper -->
          <div class="flex items-center justify-between text-[10px] font-bold uppercase tracking-wider text-slate-400 px-1">
            <span>← Strona prawa pacjenta</span>
            <span>Strona lewa pacjenta →</span>
          </div>

          <!-- 4-Quadrant Anatomical Cross -->
          <div class="relative">
            <!-- Upper Arch -->
            <div class="grid grid-cols-2 gap-3 pb-3 border-b-2 border-teal-500/30">
              <!-- Q1 / Q5 -->
              <div class="pr-2 border-r-2 border-teal-500/30 space-y-1.5">
                <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 text-right">${qTopLeft.title}</p>
                <div class="grid ${gridCols} gap-1">${qTopLeft.row1.map(renderToothButton).join('')}</div>
                <div class="grid ${gridCols} gap-1">${!isPerm ? '<div></div>' : ''}${qTopLeft.row2.map(renderToothButton).join('')}</div>
              </div>
              <!-- Q2 / Q6 -->
              <div class="pl-0.5 space-y-1.5">
                <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400">${qTopRight.title}</p>
                <div class="grid ${gridCols} gap-1">${qTopRight.row1.map(renderToothButton).join('')}</div>
                <div class="grid ${gridCols} gap-1">${qTopRight.row2.map(renderToothButton).join('')}</div>
              </div>
            </div>

            <!-- Lower Arch -->
            <div class="grid grid-cols-2 gap-3 pt-3">
              <!-- Q4 / Q8 -->
              <div class="pr-2 border-r-2 border-teal-500/30 space-y-1.5">
                <div class="grid ${gridCols} gap-1">${!isPerm ? '<div></div>' : ''}${qBotLeft.row1.map(renderToothButton).join('')}</div>
                <div class="grid ${gridCols} gap-1">${qBotLeft.row2.map(renderToothButton).join('')}</div>
                <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 text-right pt-0.5">${qBotLeft.title}</p>
              </div>
              <!-- Q3 / Q7 -->
              <div class="pl-0.5 space-y-1.5">
                <div class="grid ${gridCols} gap-1">${qBotRight.row1.map(renderToothButton).join('')}</div>
                <div class="grid ${gridCols} gap-1">${qBotRight.row2.map(renderToothButton).join('')}</div>
                <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 pt-0.5">${qBotRight.title}</p>
              </div>
            </div>
          </div>

          <!-- Selected Tooth Detail Card -->
          <div class="rounded-2xl bg-gradient-to-br from-teal-50 to-sky-50 dark:from-teal-900/30 dark:to-sky-900/20 border border-teal-200/80 dark:border-teal-800 p-4">
            <div class="flex items-start gap-3">
              <div class="w-12 h-12 rounded-2xl bg-teal-600 text-white font-display font-extrabold text-xl flex items-center justify-center shrink-0 shadow-sm">
                ${info.code}
              </div>
              <div class="min-w-0 flex-1">
                <span class="text-[10px] font-bold uppercase tracking-wide text-teal-700 dark:text-teal-300">${info.quadrantName}</span>
                <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white leading-snug mt-0.5">${info.polishName}</h3>
                <p class="text-xs italic text-slate-500 dark:text-slate-400">${info.latinName}</p>
              </div>
            </div>
            <div class="mt-3 pt-3 border-t border-teal-200/60 dark:border-teal-800/70 space-y-1.5 text-xs">
              <p class="text-slate-700 dark:text-slate-200"><strong class="text-teal-700 dark:text-teal-300">Anatomia korzeni:</strong> ${info.roots}</p>
              <p class="text-slate-600 dark:text-slate-300 leading-relaxed"><strong class="text-teal-700 dark:text-teal-300">Wskazówka asystencka:</strong> ${info.note}</p>
            </div>
          </div>
        </section>
      `;
    }

    function renderAbbreviationsSection() {
      const q = ui.abbrSearch.toLowerCase().trim();
      const filtered = DENTAL_ABBREVIATIONS.filter(item =>
        !q || item.code.toLowerCase().includes(q) || item.name.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q)
      );

      return `
        <section class="space-y-3">
          <div class="relative">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input type="text" value="${escapeHtml(ui.abbrSearch)}" oninput="ui.abbrSearch = this.value; renderCurrentTab();" placeholder="Szukaj symbolu (np. P, W, Im, MOD)..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
          </div>

          <div class="space-y-2">
            ${filtered.map(item => `
              <div class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-3.5 flex items-start gap-3 shadow-soft">
                <span class="min-w-[46px] text-center px-2 py-1.5 rounded-xl font-display font-extrabold text-xs shrink-0 ${item.color}">
                  ${escapeHtml(item.code)}
                </span>
                <div>
                  <h4 class="font-bold text-sm text-slate-900 dark:text-white leading-tight">${escapeHtml(item.name)}</h4>
                  <p class="text-xs text-slate-600 dark:text-slate-300 mt-0.5 leading-relaxed">${escapeHtml(item.desc)}</p>
                </div>
              </div>
            `).join('')}
            ${filtered.length === 0 ? '<p class="text-center text-xs text-slate-500 py-6">Nie znaleziono pasującego skrótu.</p>' : ''}
          </div>
        </section>
      `;
    }

    function toggleChecklistItem(id) {
      state.checklist[id] = !state.checklist[id];
      saveState();
      renderCurrentTab();
    }

    function resetChecklist() {
      state.checklist = {};
      saveState();
      renderCurrentTab();
      showToast('Checklista wyzerowana na nowy dzień!', 'info');
    }

    function renderChecklistSection() {
      const total = STERILIZATION_CHECKLIST.length;
      const done = STERILIZATION_CHECKLIST.filter(item => state.checklist[item.id]).length;
      const pct = Math.round((done / total) * 100);

      return `
        <section class="rounded-2xl bg-white dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700/80 p-4 shadow-soft space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white">Sterylizacja i przygotowanie unitu</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">Wykonano ${done} z ${total} kroków (${pct}%)</p>
            </div>
            <button onclick="resetChecklist()" class="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-teal-100 dark:hover:bg-teal-900/40 flex items-center gap-1">
              <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Resetuj
            </button>
          </div>

          <div class="h-2 bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-teal-500 to-emerald-500 rounded-full transition-all duration-300" style="width: ${pct}%"></div>
          </div>

          <div class="space-y-2">
            ${STERILIZATION_CHECKLIST.map(item => {
              const checked = Boolean(state.checklist[item.id]);
              return `
                <button onclick="toggleChecklistItem('${item.id}')" class="w-full text-left p-3 rounded-xl border transition-all flex items-start gap-3 ${
                  checked
                    ? 'bg-teal-50/70 dark:bg-teal-900/25 border-teal-200 dark:border-teal-800'
                    : 'bg-slate-50 dark:bg-slate-900/50 border-slate-200/70 dark:border-slate-700/70 hover:border-teal-400'
                }">
                  <span class="w-5 h-5 rounded-md mt-0.5 flex items-center justify-center shrink-0 border transition-colors ${
                    checked ? 'bg-teal-600 border-teal-600 text-white' : 'bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-600'
                  }">
                    ${checked ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
                  </span>
                  <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold leading-snug ${checked ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-800 dark:text-slate-100'}">${item.text}</p>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">${item.sub}</p>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function toggleKitAccordion(kitId) {
      ui.openKitId = ui.openKitId === kitId ? null : kitId;
      renderCurrentTab();
    }

    function renderKitsSection() {
      return `

    /* =========================================================================
       14. TAB 5: DZIENNICZEK (LOGBOOK TABLE, EXPORT, BACKUP & SETTINGS)
       ========================================================================= */
    function renderDzienniczekTab() {
      const stats = computeStats();

          <div class="flex items-center gap-2">
            <i data-lucide="sliders-horizontal" class="w-4 h-4 text-teal-600 dark:text-teal-400"></i>
            <h3 class="font-display font-bold text-sm text-slate-900 dark:text-white">Ustawienia praktyk i dane do wydruku</h3>

            <div>

            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Nazwa gabinetu / placówki</label>
              <input type="text" id="set-clinic" placeholder="Np. Centrum Stomatologii DentaSmile" value="${escapeHtml(state.settings.clinicName)}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 dark:text-slate-300 mb-1">Opiekun praktyk</label>
              <input type="text" id="set-supervisor" placeholder="Np. lek. dent. Marta Wiśniewska" value="${escapeHtml(state.settings.supervisorName)}" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
            </div>

            <button type="submit" class="w-full py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm transition-colors">
              Zapisz ustawienia
            </button>
          </form>

          <!-- Protected Clear Data Section (collapsed by default to prevent accidental taps) -->
          <details class="pt-3 border-t border-slate-100 dark:border-slate-700 group">
            <summary class="cursor-pointer list-none flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 py-1 select-none">
              <span class="flex items-center gap-1.5">
                <i data-lucide="shield-alert" class="w-4 h-4"></i>
                Strefa niebezpieczna (reset danych)
              </span>
              <i data-lucide="chevron-down" class="w-4 h-4 transition-transform group-open:rotate-180"></i>
            </summary>
            <div class="mt-2.5 space-y-2">
              <p class="text-[11px] text-slate-500 dark:text-slate-400 leading-relaxed">
                Przed wyczyszczeniem danych zalecamy pobranie kopii zapasowej JSON powyżej.
              </p>
              <button onclick="confirmClearAllData()" class="w-full py-2.5 px-3 rounded-xl bg-rose-50 dark:bg-rose-900/25 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/70 text-xs font-bold hover:bg-rose-100 flex items-center justify-center gap-1.5">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
                Wyczyść wszystkie dane
              </button>
            </div>
          </details>
        </section>
      `;
    }

    function saveSettingsForm(event) {
      event.preventDefault();
      state.settings.targetHours = Math.max(1, parseInt(document.getElementById('set-target').value, 10) || 140);
      state.settings.studentName = document.getElementById('set-student').value.trim();
      state.settings.clinicName = document.getElementById('set-clinic').value.trim();
      state.settings.supervisorName = document.getElementById('set-supervisor').value.trim();
      saveState();
      renderCurrentTab();
      showToast('Ustawienia zostały zapisane!', 'success');
    }

    /* =========================================================================
       15. EXPORT, PRINT, COPY & BACKUP HANDLERS
       ========================================================================= */
    function printLogbook() {
      const stats = computeStats();
      const sorted = [...stats.completedShifts].sort((a, b) => a.date.localeCompare(b.date));
      const printEl = document.getElementById('print-view');

      printEl.innerHTML = `
        <div style="margin-bottom: 18px; border-bottom: 2px solid #0d9488; padding-bottom: 10px;">
          <h1 style="font-size: 18px; font-weight: 800; margin: 0 0 4px 0;">DZIENNICZEK PRAKTYK ZAWODOWYCH</h1>
          <p style="font-size: 12px; color: #4b5563; margin: 0;">Kierunek: Asystentka stomatologiczna (szkoła policealna)</p>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; margin-bottom: 16px;">
          <div><strong>Praktykantka:</strong> ${escapeHtml(state.settings.studentName || '........................................')}</div>
          <div><strong>Wymiar praktyk:</strong> ${formatHours(stats.completedHours)} h / ${stats.target} h (${stats.percent}%)</div>
          <div><strong>Placówka / Gabinet:</strong> ${escapeHtml(state.settings.clinicName || '........................................')}</div>
          <div><strong>Opiekun praktyk:</strong> ${escapeHtml(state.settings.supervisorName || '........................................')}</div>
        </div>

        <table>
          <thead>
            <tr>
              <th style="width: 32px;">Lp.</th>
              <th style="width: 82px;">Data</th>
              <th style="width: 88px;">Godziny</th>
              <th style="width: 58px;">Liczba godz.</th>
              <th>Wykonywane czynności i opis dyżuru</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.length === 0 ? `
              <tr><td colspan="5" style="text-align: center; padding: 16px;">Brak zapisanych odbytych dyżurów.</td></tr>
            ` : sorted.map((s, idx) => {
              const desc = s.note || (s.tags && s.tags.length ? s.tags.join(', ') : 'Praktyka zawodowa');
              return `
                <tr>
                  <td>${idx + 1}.</td>
                  <td>${formatDisplayDate(s.date)}</td>
                  <td>${s.startTime || '--:--'} – ${s.endTime || '--:--'}</td>
                  <td><strong>${formatHours(s.hours)} h</strong></td>
                  <td>${escapeHtml(desc)}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" style="text-align: right; font-weight: 700;">RAZEM ODBYTE GODZINY:</td>
              <td colspan="2" style="font-weight: 800;">${formatHours(stats.completedHours)} h (z wymaganych ${stats.target} h)</td>
            </tr>
          </tfoot>
        </table>

        <div style="display: flex; justify-content: space-between; margin-top: 48px; font-size: 11px;">
          <div style="text-align: center; width: 42%;">
            <div style="border-top: 1px solid #6b7280; padding-top: 6px;">Podpis praktykantki</div>
          </div>
          <div style="text-align: center; width: 42%;">
            <div style="border-top: 1px solid #6b7280; padding-top: 6px;">Pieczątka placówki i podpis opiekuna praktyk</div>
          </div>
        </div>
      `;

      setTimeout(() => window.print(), 100);
    }

    function copySummaryText() {
      const stats = computeStats();
      const sorted = [...stats.completedShifts].sort((a, b) => a.date.localeCompare(b.date));
      let lines = [
        `DZIENNICZEK PRAKTYK — ASYSTENTKA STOMATOLOGICZNA`,
        `Praktykantka: ${state.settings.studentName || '—'}`,
        `Gabinet: ${state.settings.clinicName || '—'}`,
        `Opiekun: ${state.settings.supervisorName || '—'}`,
        `Postęp: ${formatHours(stats.completedHours)} / ${stats.target} h (${stats.percent}%)`,
        `--------------------------------------------------`
      ];

      sorted.forEach((s, idx) => {
        const desc = s.note || (s.tags && s.tags.length ? s.tags.join(', ') : 'Praktyka zawodowa');
        lines.push(`${idx + 1}. ${formatDisplayDate(s.date)} (${s.startTime || ''}-${s.endTime || ''}, ${formatHours(s.hours)} h) — ${desc}`);
      });

      copyToClipboard(lines.join('\n'));
    }

    function exportCSV() {
      const stats = computeStats();
      const sorted = [...stats.completedShifts].sort((a, b) => a.date.localeCompare(b.date));
      const header = ['Lp', 'Data', 'Godzina start', 'Godzina koniec', 'Przerwa (min)', 'Liczba godzin', 'Tagi', 'Opis do dzienniczka'];

      const escapeCsv = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;
      const rows = sorted.map((s, idx) => [
        idx + 1,
        formatDisplayDate(s.date),
        s.startTime || '',
        s.endTime || '',
        s.breakMins || 0,
        String(s.hours).replace('.', ','),
        (s.tags || []).join(', '),
        s.note || ''
      ].map(escapeCsv).join(';'));

      // UTF-8 BOM for proper Polish diacritics in Microsoft Excel
      const csvContent = '\uFEFF' + [header.map(escapeCsv).join(';'), ...rows].join('\r\n');
      downloadFile(csvContent, `DentaLog_Praktyki_${formatLocalDate()}.csv`, 'text/csv;charset=utf-8;');
      showToast('Wyeksportowano plik CSV dla Excela!', 'success');
    }

    function exportBackupJSON() {
      const jsonStr = JSON.stringify(state, null, 2);
      downloadFile(jsonStr, `DentaLog_Kopia_${formatLocalDate()}.json`, 'application/json');
      showToast('Kopia zapasowa JSON zapisana!', 'success');
    }

    function importBackupJSON(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.shifts)) {
            throw new Error('Nieprawidłowy format pliku kopii zapasowej.');
          }
          state = {
            settings: { ...defaultState.settings, ...(parsed.settings || {}) },
            shifts: parsed.shifts,
            notes: Array.isArray(parsed.notes) ? parsed.notes : [],
            timer: { ...defaultState.timer, ...(parsed.timer || {}) },
            checklist: parsed.checklist || {}
          };
          saveState();
          applyTheme();
          renderCurrentTab();
          showToast('Wczytano kopię zapasową!', 'success');
        } catch (err) {
          console.error(err);
          showToast('Błąd wczytywania pliku JSON.', 'error');
        } finally {
          event.target.value = '';
        }
      };
      reader.readAsText(file);
    }

    function downloadFile(content, filename, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    /* =========================================================================
       16. CLEAR DATA
       ========================================================================= */
    function confirmClearAllData() {
      openConfirmModal({
        title: 'Wyczyścić wszystkie dane?',
        message: 'Wszystkie zapisane godziny, dyżury, notatki oraz ustawienia zostaną trwale usunięte z tego urządzenia.',
        confirmText: 'Tak, wyczyść wszystko',
        danger: true,
        onConfirm: () => {
          const dark = state.settings.darkMode;
          state = structuredClone(defaultState);
          state.settings.darkMode = dark;
          saveState();
          renderCurrentTab();
          showToast('Wszystkie dane zostały wyczyszczone.', 'info');
        }
      });
    }

    /* =========================================================================
       17. SHARED MODAL & CONFIRMATION DIALOG SYSTEM (NO NATIVE ALERT/CONFIRM)
       ========================================================================= */
    function showModal() {
      const root = document.getElementById('modal-root');
      root.classList.remove('hidden');
      root.classList.add('flex');
      document.body.style.overflow = 'hidden';
      if (window.lucide) lucide.createIcons();
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
      root.innerHTML = '';
      document.body.style.overflow = '';
    }

    // Close modal when clicking backdrop
    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    function openConfirmModal({ title, message, confirmText = 'Potwierdź', danger = false, onConfirm }) {
      const modalRoot = document.getElementById('modal-root');
      modalRoot.innerHTML = `
        <div class="w-[92%] max-w-sm bg-white dark:bg-slate-900 rounded-3xl p-5 shadow-2xl animate-slide-up border border-slate-200 dark:border-slate-800 m-auto">
          <div class="w-11 h-11 rounded-2xl ${danger ? 'bg-rose-100 dark:bg-rose-900/40 text-rose-600 dark:text-rose-400' : 'bg-teal-100 dark:bg-teal-900/40 text-teal-600'} flex items-center justify-center mb-3">
            <i data-lucide="${danger ? 'alert-triangle' : 'help-circle'}" class="w-5 h-5"></i>
          </div>
          <h3 class="font-display font-bold text-base text-slate-900 dark:text-white mb-1">${escapeHtml(title)}</h3>
          <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed mb-5">${escapeHtml(message)}</p>
          <div class="flex items-center gap-2">
            <button id="cm-cancel" class="flex-1 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-sm">Anuluj</button>
            <button id="cm-ok" class="flex-1 py-2.5 rounded-xl ${danger ? 'bg-rose-600 hover:bg-rose-700' : 'bg-teal-600 hover:bg-teal-700'} text-white font-bold text-sm">${escapeHtml(confirmText)}</button>
          </div>
        </div>
      `;
      showModal();
      document.getElementById('cm-cancel').onclick = closeModal;
      document.getElementById('cm-ok').onclick = () => {
        closeModal();
        if (typeof onConfirm === 'function') onConfirm();
      };
    }

    /* =========================================================================
       18. APP INITIALIZATION
       ========================================================================= */
    function initApp() {
      applyTheme();
      startTimerLoop();
      switchTab('pulpit');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
